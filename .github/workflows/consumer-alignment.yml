name: Check consumer alignment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify both websites pin the same core revision
        run: ./scripts/check-consumer-alignment.sh
