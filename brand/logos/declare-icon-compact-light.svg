<?xml version="1.0" encoding="utf-8"?>
<svg width="690" height="1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="34.008 8.029 121.475 180.235" xml:space="preserve" role="img" aria-labelledby="title desc"
  >
<title id="title">DeCLaRe robot icon, light theme</title>
<desc id="desc">The DeCLaRe robot mascot with circular green eye and angular red eye.</desc>
<style type="text/css">
  /* DeCLaRe identity: wordmark purple #7C3AED; green eye
     #34A853; red angular eye #EB4336. */
  /* Classic robot: one themeable silhouette (currentColor) with interior detail
     carved out via #robot-knockout. */
  .theme { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 500; letter-spacing: .2px; }

</style>

<defs>

  <clipPath id="robot-antenna-clip"><rect x="71.5" y="8.7" width="21.5" height="24.2"/></clipPath>
  <mask id="robot-knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
    <rect x="133.6" y="63.7" width="14.6" height="11.8" fill="#fff"/>
    <path fill="#fff" d="M94.7,11.2c0.2,0,5.3,0,10.5,0.5c17.2,2.1,30.7,15.6,32.8,32.8c0.5,5.2,0.5,10.3,0.5,10.5c0,0.2,0,5.3-0.5,10.5c-2.1,17.2-15.6,30.7-32.8,32.8c-5.2,0.5-10.3,0.5-10.5,0.5c-0.2,0-5.3,0-10.5-0.5c-17.2-2.1-30.7-15.6-32.8-32.8c-0.5-5.2-0.5-10.3-0.5-10.5c0-0.2,0-5.3,0.5-10.5c2.1-17.2,15.6-30.7,32.8-32.8C89.4,11.2,94.5,11.2,94.7,11.2z"/>
    <path fill="#000" d="M94.7,13.3c0.2,0,4.6,0,9.2,0.5c15.1,1.8,27,13.8,28.9,28.9c0.5,4.6,0.5,9.1,0.5,9.2s0,4.6-0.5,9.2c-1.8,15.1-13.8,27-28.9,28.9c-4.6,0.5-9.1,0.5-9.2,0.5c-0.2,0-4.6,0-9.2-0.5c-15.1-1.8-27-13.8-28.9-28.9c-0.5-4.6-0.5-9.1-0.5-9.2s0-4.6,0.5-9.2c1.8-15.1,13.8-27,28.9-28.9C90.1,13.3,94.6,13.3,94.7,13.3z"/>
    <rect x="43.7" y="1" width="102" height="66.2" fill="#000"/>
    <rect x="41.3" y="63.7" width="14.6" height="11.8" fill="#fff"/>
    <rect x="34.1" y="167.5" width="121.3" height="20.7" fill="#fff"/>
    <rect x="52.1" y="106.2" width="85.3" height="53.9" fill="#fff"/>
    <!-- chest panel: one tall cut-out carrying the circuit board -->
    <rect x="59.3" y="113.4" width="70.9" height="39.5" fill="#000"/>
    <rect x="84" y="9.9" width="13.7" height="20.7" transform="matrix(0.9301 -0.3673 0.3673 0.9301 -1.0708 34.7719)" fill="#fff"/>
    <path clip-path="url(#robot-antenna-clip)" fill="none" stroke="#000" stroke-width="6" d="M73.9,12.4c3.4,1.8,6.5,4.4,9.3,7.5c2.9,3.3,5.3,7.2,5.8,11.7"/>
    <!-- Head frame as a top bar and two walls, deliberately not one filled
         rect with the window punched through it. Those two rects had bottom
         edges 0.4 apart; they cancel exactly at size, but inside a single
         favicon pixel the black composites over the white instead of
         subtracting, leaving ~20% ink straight across the head that reads as
         a line under the eyes joining the mouth tabs. -->
    <rect x="34.1" y="24.6" width="121.3" height="7.2" fill="#fff"/>
    <rect x="34.1" y="24.6" width="7.2" height="43.4" fill="#fff"/>
    <rect x="148.2" y="24.6" width="7.2" height="43.4" fill="#fff"/>
    <rect x="41.3" y="31.8" width="106.9" height="36.6" fill="#000"/>
    <!-- Circuit board, small cut.  One trace at wall weight.  Below ~32 px
         the panel is about 7 px tall; two thin traces silt up into grey, while a
         single heavy trace and node still resolve. -->
    <g stroke="#fff" stroke-width="7.5" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
      <path d="M59.3 128H92l10 10h10"/>
    </g>
    <circle cx="112" cy="138" r="8.5" fill="#fff"/>
  </mask>
  <g id="robot-master">
    <rect x="0" y="0" width="200" height="200" fill="currentColor" mask="url(#robot-knockout)"/>
    <circle cx="72.5" cy="52.5" r="12.9" fill="#34A853"/>
    <!-- Angular eye as two filled rectangles (matching the head's wall logic):
         a horizontal bar and a diagonal bar sharing a vertical left edge, so
         their intersection reads as a clean square corner, not a beveled cut. -->
    <g fill="#EB4336"><rect x="103.72" y="57.2" width="26.18" height="5.4"/><rect x="0" y="-5.4" width="27" height="5.4" transform="translate(103.72 62.6) rotate(-35.3)"/></g>
  </g>
  
</defs>
<g id="robot" style="color:#000000"><use xlink:href="#robot-master"/></g>
</svg>
